<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">

    <h1>🐾 Wildlife Species Classifier</h1>

    <img src="/{{ image }}" width="350">

    <h2>{{ species }}</h2>

    <h3>Confidence: {{ confidence }}%</h3>

    <table border="1" cellpadding="10">

        <tr>
            <th>Scientific Name</th>
            <td>{{ scientific_name }}</td>
        </tr>

        <tr>
            <th>Diet</th>
            <td>{{ diet }}</td>
        </tr>

        <tr>
            <th>Habitat</th>
            <td>{{ habitat }}</td>
        </tr>

        <tr>
            <th>Lifespan</th>
            <td>{{ lifespan }}</td>
        </tr>

        <tr>
            <th>Status</th>
            <td>{{ status }}</td>
        </tr>

        <tr>
            <th>Interesting Fact</th>
            <td>{{ fact }}</td>
        </tr>

    </table>

    <br>

    <a href="/">⬅ Upload Another Image</a>

</div>

</body>
</html>
